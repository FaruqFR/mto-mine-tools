<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Cipta Kridatama Mining Academy</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:linear-gradient(135deg,#052d6d,#0b55c5);min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif}.login{width:min(420px,calc(100% - 40px));background:#fff;border-radius:16px;padding:34px;box-shadow:0 25px 70px #0005;text-align:center}.login img{width:190px;height:110px;object-fit:contain;margin-bottom:5px}.login h1{margin:0;color:#12305e;font-size:25px}.login p{color:#667085;font-size:12px;margin:7px 0 24px}.login label{display:block;text-align:left;font-size:12px;font-weight:800;color:#24395f;margin:12px 0 6px}.login input{width:100%;height:42px;box-sizing:border-box;border:1px solid #ccd6e5;border-radius:7px;padding:0 12px;font-size:14px}.login button{width:100%;height:44px;margin-top:17px;border:0;border-radius:7px;background:#073d91;color:#fff;font-weight:800;cursor:pointer}.err{height:18px;margin-top:10px;color:#b42318;font-size:11px}.foot{margin-top:18px;color:#98a2b3;font-size:10px}</style></head><body><div class="login"><img src="assets/ck-logo.svg" alt="Cipta Kridatama"><h1>MTO Mine Tools</h1><p>MINING ACADEMY · CIPTA KRIDATAMA</p><form id="loginForm"><label>Username</label><input id="u" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required><button>MASUK KE MINE TOOLS</button><div class="err" id="err"></div></form><div class="foot">Akses terbatas · Cipta Kridatama Mining Academy</div></div><script>const U='admin',P='BMB2026',K='mto_ok';async function clearOld(){try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){} }clearOld();if(sessionStorage.getItem(K)==='1')location.replace('dashboard.html');loginForm.onsubmit=async e=>{e.preventDefault();if(u.value.trim()===U&&p.value===P){sessionStorage.setItem(K,'1');await clearOld();location.replace('dashboard.html')}else err.textContent='Username atau password salah.'}</script></body></html>
