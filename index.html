<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#073b93"><title>Login — MTO Mine Tools</title><style>:root{--b:#073b93;--b2:#0b55c5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#061f50,#0b55c5);display:grid;place-items:center;padding:20px;font-family:"Segoe UI",Arial,sans-serif}.box{width:min(430px,100%);background:#fff;border-radius:16px;padding:34px;box-shadow:0 24px 70px #0005;text-align:center}.logo{width:64px;height:64px;border-radius:12px;background:var(--b);color:#fff;display:grid;place-items:center;margin:0 auto 15px;font-weight:900;font-size:22px}.box h1{margin:0;color:#15264a;font-size:25px}.sub{color:#667085;font-size:12px;margin:7px 0 25px}.box label{display:block;text-align:left;margin:12px 0 6px;color:#344054;font-size:13px;font-weight:800}.box input{width:100%;height:42px;padding:0 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}.box button{width:100%;height:44px;margin-top:18px;background:var(--b);color:#fff;border:0;border-radius:8px;font-weight:800;cursor:pointer}.box button:hover{background:var(--b2)}.err{height:18px;color:#b42318;font-size:12px;margin-top:12px}.foot{margin-top:20px;color:#98a2b3;font-size:10px}</style></head><body><div class="box"><div class="logo">MTO</div><h1>MTO Mine Tools</h1><div class="sub">BMB MINING ACADEMY · SECURE ACCESS</div><form id="f"><label for="u">Username</label><input id="u" autocomplete="username" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required><button type="submit">MASUK KE MINE TOOLS</button><div class="err" id="e"></div></form><div class="foot">PT Cipta Kridatama · Site BMB</div></div><script>const U='admin',P='BMB2026',K='mto_ok';if(sessionStorage.getItem(K)==='1')location.replace('dashboard.html');document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('u').value.trim()===U&&document.getElementById('p').value===P){sessionStorage.setItem(K,'1');location.replace('dashboard.html')}else document.getElementById('e').textContent='Username atau password salah.'});</script></body></html>
