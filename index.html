<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — MTO Mine Tools</title><style>:root{--b:#073b93;--b2:#0b55c5}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#061f50,#0b55c5);display:grid;place-items:center;padding:20px}.box{width:min(410px,100%);background:#fff;border-radius:18px;padding:34px;box-shadow:0 20px 60px #0005;text-align:center}.logo{width:60px;height:60px;border-radius:14px;background:var(--b);color:#fff;display:grid;place-items:center;margin:0 auto 15px;font-weight:900;font-size:18px}.box h1{margin:0;color:#172033;font-size:25px}.sub{color:#667085;font-size:12px;margin:7px 0 25px}.box label{display:block;text-align:left;margin:12px 0 6px;color:#344054;font-size:13px;font-weight:700}.box input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}.box button{width:100%;margin-top:18px;background:var(--b);color:#fff;border:0;border-radius:8px;padding:12px;font-weight:800;cursor:pointer}.box button:hover{background:var(--b2)}.err{color:#b42318;font-size:12px;min-height:18px;margin-top:12px}.foot{margin-top:22px;color:#98a2b3;font-size:10px}</style></head><body><div class="box"><div class="logo">MTO</div><h1>MTO Mine Tools</h1><div class="sub">BMB MINING ACADEMY · LOGIN</div><form id="f"><label>Username</label><input id="u" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required><button>MASUK KE DASHBOARD</button><div class="err" id="e"></div></form><div class="foot">PT Cipta Kridatama · Site BMB</div></div><script>const U='admin',P='BMB2026';if(sessionStorage.getItem('mto_ok')==='1')location.replace('dashboard.html');document.getElementById('f').onsubmit=e=>{e.preventDefault();if(u.value.trim()===U&&p.value===P){sessionStorage.setItem('mto_ok','1');location.replace('dashboard.html')}else e.textContent='Username atau password salah.'}</script></body></html>
